<app-ventana titulo="Consulta de taller" ancho="1100px" [ajustada]="true" (cerrar)="cerrar()">
  @if (cargando()) {
    <p class="ventana-aviso">Cargando...</p>
  } @else if (error()) {
    <p class="ventana-error" role="alert">{{ error() }}</p>
  } @else if (bloques().length === 0) {
    <p class="ventana-aviso">No hay móviles en taller ahora mismo.</p>
  } @else {
    <div class="bloques">
      @for (b of bloques(); track b.taller) {
        <section class="bloque">
          <div class="bloque-cab">
            <h3 class="bloque-taller">{{ b.taller }}</h3>
            <span class="pildora">{{ b.count }} {{ b.count === 1 ? 'móvil' : 'móviles' }}</span>
            <button
              type="button"
              class="boton-app pequeno bloque-copiar"
              [class.hecho]="copiado() === b.taller"
              (click)="copiar(b)"
            >
              <app-icono [nombre]="copiado() === b.taller ? 'check' : 'copiar'" />
              {{ copiado() === b.taller ? 'Copiado' : 'Copiar' }}
            </button>
          </div>
          <pre class="bloque-texto">{{ b.texto }}</pre>
        </section>
      }
    </div>
  }
</app-ventana>
