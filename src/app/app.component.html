@if (conexion.caida()) {
<div class="banda-offline">
    <span class="banda-texto">⚠ No se puede conectar con el servidor</span>
    <button type="button" class="banda-btn" (click)="conexion.reintentar()">Reintentar</button>
</div>
}

@if (!esLogin()) {
<app-barra-superior class="armazon-barra" />
}

<main class="armazon-main">
    <router-outlet />
</main>

@if (!esLogin()) {
<app-pestanas class="armazon-pestanas" />
}
