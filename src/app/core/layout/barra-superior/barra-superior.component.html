<header class="barra" [class.con-admin]="conAdmin()">
  <a routerLink="/tablero" class="marca" aria-label="PhoneCity">
    <img class="marca-icono" src="iconos/icono-192.png" alt="" width="28" height="28" />
    <span class="marca-texto">PhoneCity</span>
  </a>

  <nav class="enlaces" aria-label="Navegación principal">
    @for (e of enlaces(); track e.ruta) {
      <a [routerLink]="e.ruta" routerLinkActive="activo" class="enlace" [title]="e.texto">
        <app-icono [nombre]="e.icono" />
        <span class="enlace-texto">{{ e.texto }}</span>
      </a>
    }
  </nav>

  <div class="ajustes">
    <button
      type="button"
      class="enlace boton-ajustes"
      [class.abierto]="menuAbierto()"
      (click)="alternarMenu()"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuAbierto()"
      aria-label="Ajustes"
      title="Ajustes"
    >
      <app-icono nombre="ajustes" />
      <span class="texto-ajustes">Ajustes</span>
    </button>

    @if (menuAbierto()) {
      <div class="menu" role="menu" aria-label="Ajustes">
        <div class="menu-seccion">
          <span class="menu-titulo">Divisor de fecha</span>
          <app-selector-divisor />
        </div>
        @if (esAdmin()) {
          <a routerLink="/importar" class="menu-item" role="menuitem" (click)="cerrarMenu()">
            <app-icono nombre="importar" />
            Importar
          </a>
          <a routerLink="/modelos/limpiar" class="menu-item" role="menuitem" (click)="cerrarMenu()">
            <app-icono nombre="limpiar" />
            Limpiar modelos
          </a>        }
        <button type="button" class="menu-item peligro" role="menuitem" (click)="cerrarSesion()">
          <app-icono nombre="salir" />
          Cerrar sesión
        </button>
      </div>
    }
  </div>
</header>
